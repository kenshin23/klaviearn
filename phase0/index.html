<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klaviearn — Phase 0</title>
<script src="vexflow.js"></script>
<style>
  :root {
    --bg: #14141c;
    --card: #f6f1e6;
    --text: #f2f2f7;
    --dim: #a9a9bd;
    --ok: #3ddc84;
    --bad: #ff5d6c;
    --accent: #7aa2ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 22px; line-height: 1.45;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 16px;
  }
  header {
    width: 100%; max-width: 900px; display: flex;
    justify-content: space-between; align-items: baseline; gap: 12px;
  }
  h1 { font-size: 28px; margin: 0; letter-spacing: 0.5px; }
  h1 span { color: var(--accent); }
  #score { font-size: 26px; font-weight: 700; }

  #card {
    width: 100%; max-width: 900px; background: var(--card);
    border-radius: 18px; margin-top: 14px; padding: 8px 14px;
    border: 6px solid transparent; transition: border-color 0.15s;
  }
  #card.ok  { border-color: var(--ok); }
  #card.bad { border-color: var(--bad); }
  #staff svg { width: 100%; height: auto; max-height: 56vh; display: block; }

  #status {
    width: 100%; max-width: 900px; margin-top: 12px; min-height: 2.4em;
    font-size: 26px; font-weight: 600; text-align: center;
  }
  #status .ok  { color: var(--ok); }
  #status .bad { color: var(--bad); }
  #hearing { font-size: 19px; color: var(--dim); font-weight: 400; display: block; }

  .row {
    width: 100%; max-width: 900px; display: flex; flex-wrap: wrap;
    gap: 10px; margin-top: 12px; justify-content: center;
  }
  button {
    font-size: 22px; font-weight: 600; padding: 12px 18px;
    border-radius: 12px; border: 2px solid #3a3a4e;
    background: #23232f; color: var(--text); cursor: pointer;
    min-height: 56px;
  }
  button:active { transform: scale(0.97); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #10101a; }
  button.listening { background: #1d3a2a; border-color: var(--ok); color: var(--ok); }

  #keys button {
    min-width: 64px; font-size: 26px; font-weight: 800; color: #10101a;
    border: none;
  }
  label.toggle {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 20px; color: var(--dim); padding: 8px 4px; cursor: pointer;
  }
  input[type="checkbox"] { width: 24px; height: 24px; }
  #inputs { font-size: 18px; color: var(--dim); text-align: center; margin-top: 10px; }
</style>
</head>
<body>

<header>
  <h1>Klavi<span>earn</span> <small style="font-size:16px;color:var(--dim)">phase 0</small></h1>
  <div id="score">0 / 0</div>
</header>

<div id="card"><div id="staff"></div></div>

<div id="status">Press <b>Start microphone</b>, then play the note you see.<span id="hearing"></span></div>

<div class="row">
  <button id="micBtn" class="primary">🎤 Start microphone</button>
  <button id="hearBtn">🔊 Hear target</button>
  <button id="skipBtn">Skip ▸</button>
</div>

<div class="row" id="keys"></div>

<div class="row">
  <label class="toggle"><input type="checkbox" id="optLetters" checked> Letter names</label>
  <label class="toggle"><input type="checkbox" id="optColors" checked> Note colors</label>
  <label class="toggle"><input type="checkbox" id="optOctave"> Strict octave</label>
</div>

<div id="inputs">MIDI: checking…</div>

<script>
"use strict";
const VF = Vex.Flow;

// ---------- Note set: C4–C5 on the treble staff (C4 brings a ledger line) ----------
const LETTER_COLORS = { // Boomwhackers-style, one color per letter name
  C: "#e8334a", D: "#f2730d", E: "#d6a800", F: "#4faf1e",
  G: "#0e9e8a", A: "#7d59e0", B: "#d4319c",
};
const NOTES = [
  { key: "c/4", letter: "C", midi: 60 },
  { key: "d/4", letter: "D", midi: 62 },
  { key: "e/4", letter: "E", midi: 64 },
  { key: "f/4", letter: "F", midi: 65 },
  { key: "g/4", letter: "G", midi: 67 },
  { key: "a/4", letter: "A", midi: 69 },
  { key: "b/4", letter: "B", midi: 71 },
  { key: "c/5", letter: "C", midi: 72 },
];
const NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const noteName = m => NAMES[m % 12] + (Math.floor(m / 12) - 1);
const midiFreq = m => 440 * Math.pow(2, (m - 69) / 12);

// ---------- State ----------
let target = null, prevTarget = null;
let ok = 0, total = 0, locked = false;
const opt = id => document.getElementById(id).checked;

// ---------- Notation (rendered big: 4x scale makes lines/noteheads thick) ----------
function draw() {
  const div = document.getElementById("staff");
  div.innerHTML = "";
  const W = 280, H = 150;
  const renderer = new VF.Renderer(div, VF.Renderer.Backends.SVG);
  renderer.resize(W, H);
  const ctx = renderer.getContext();

  const stave = new VF.Stave(8, 30, W - 16);
  stave.addClef("treble");
  stave.setContext(ctx).draw();

  const note = new VF.StaveNote({ clef: "treble", keys: [target.key], duration: "w" });
  if (opt("optColors")) {
    const c = LETTER_COLORS[target.letter];
    note.setStyle({ fillStyle: c, strokeStyle: c });
  }
  if (opt("optLetters")) {
    const ann = new VF.Annotation(target.letter)
      .setFont("Arial", 13, "bold")
      .setVerticalJustification(VF.Annotation.VerticalJustify.BOTTOM);
    note.addModifier(ann);
  }
  VF.Formatter.FormatAndDraw(ctx, stave, [note]);

  // The viewBox does the magnification: drawn at 280×150, displayed at full
  // card width, so lines and noteheads thicken proportionally.
  const svg = div.querySelector("svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.removeAttribute("width");
  svg.removeAttribute("height");
  svg.style.width = "100%";  // VexFlow sets inline px sizes that override CSS
  svg.style.height = "auto";
}

function next() {
  prevTarget = target;
  do { target = NOTES[Math.floor(Math.random() * NOTES.length)]; }
  while (prevTarget && target.midi === prevTarget.midi); // repeats confuse mic onset detection
  locked = false;
  document.getElementById("card").className = "";
  draw();
}

// ---------- Answers (from mic, MIDI, or buttons) ----------
function setStatus(html, hearing) {
  document.getElementById("status").innerHTML =
    html + `<span id="hearing">${hearing || ""}</span>`;
}
function answer(midi, pitchClassOnly) {
  if (!target || locked) return;
  const hit = pitchClassOnly || !opt("optOctave")
    ? midi % 12 === target.midi % 12
    : midi === target.midi;
  total++;
  if (hit) {
    ok++; locked = true;
    document.getElementById("card").className = "ok";
    setStatus(`<span class="ok">✓ ${target.letter} — correct!</span>`);
    chime(true);
    setTimeout(next, 900);
  } else {
    document.getElementById("card").className = "bad";
    setStatus(`<span class="bad">✗ You played ${noteName(midi)}</span> — try again, or 🔊 hear the target.`);
    chime(false);
  }
  document.getElementById("score").textContent = `${ok} / ${total}`;
}

// ---------- Sound ----------
let actx;
const audio = () => (actx ??= new (window.AudioContext || window.webkitAudioContext)());
function tone(freq, dur, type, when = 0, vol = 0.25) {
  const ctx = audio(), t = ctx.currentTime + when;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(ctx.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
const chime = good => good
  ? (tone(1046.5, 0.15, "sine"), tone(1318.5, 0.25, "sine", 0.12))
  : tone(110, 0.3, "square", 0, 0.12);
document.getElementById("hearBtn").onclick = () =>
  target && tone(midiFreq(target.midi), 0.9, "triangle");

// ---------- Microphone pitch detection (autocorrelation — single notes) ----------
function autoCorrelate(buf, sampleRate) {
  let SIZE = buf.length, rms = 0;
  for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / SIZE);
  if (rms < 0.012) return -1; // too quiet

  let r1 = 0, r2 = SIZE - 1;
  const thres = 0.2;
  for (let i = 0; i < SIZE / 2; i++) if (Math.abs(buf[i]) < thres) { r1 = i; break; }
  for (let i = 1; i < SIZE / 2; i++) if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }
  buf = buf.slice(r1, r2); SIZE = buf.length;

  const c = new Float32Array(SIZE);
  for (let i = 0; i < SIZE; i++)
    for (let j = 0; j < SIZE - i; j++) c[i] += buf[j] * buf[j + i];

  let d = 0; while (c[d] > c[d + 1]) d++;
  let maxval = -1, maxpos = -1;
  for (let i = d; i < SIZE; i++) if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
  if (maxpos <= 0) return -1;
  let T0 = maxpos;
  const x1 = c[T0 - 1], x2 = c[T0], x3 = c[T0 + 1];
  const a = (x1 + x3 - 2 * x2) / 2, b = (x3 - x1) / 2;
  if (a) T0 = T0 - b / (2 * a);
  return sampleRate / T0;
}

let micOn = false;
document.getElementById("micBtn").onclick = async function () {
  if (micOn) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
    });
    const ctx = audio();
    const src = ctx.createMediaStreamSource(stream);
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 2048;
    src.connect(analyser);
    micOn = true;
    this.textContent = "🎤 Listening…";
    this.className = "listening";
    setStatus("Play the note you see on your piano.");

    const buf = new Float32Array(analyser.fftSize);
    let stable = null, count = 0, lastAccepted = null, silent = 0;
    setInterval(() => {
      analyser.getFloatTimeDomainData(buf);
      const f = autoCorrelate(buf, ctx.sampleRate);
      const hear = document.getElementById("hearing");
      if (f < 0) {
        stable = null; count = 0;
        if (++silent > 4) lastAccepted = null; // note released → same key may be played again
        if (hear) hear.textContent = "";
        return;
      }
      silent = 0;
      const m = Math.round(69 + 12 * Math.log2(f / 440));
      if (hear) hear.textContent = `Hearing: ${noteName(m)} (${f.toFixed(0)} Hz)`;
      if (m === stable) count++; else { stable = m; count = 1; }
      // 3 stable frames ≈ 150 ms; only fire on a new note so a decaying
      // piano tone doesn't answer the next exercise by itself
      if (count === 3 && m !== lastAccepted) { lastAccepted = m; answer(m); }
    }, 50);
  } catch (e) {
    setStatus(`<span class="bad">Microphone unavailable:</span> ${e.message}`);
  }
};

// ---------- MIDI (lights up automatically when the P125 is plugged in) ----------
const midiLabel = document.getElementById("inputs");
if (navigator.requestMIDIAccess) {
  navigator.requestMIDIAccess().then(access => {
    const wire = () => {
      const names = [];
      for (const input of access.inputs.values()) {
        names.push(input.name);
        input.onmidimessage = msg => {
          const [st, note, vel] = msg.data;
          if ((st & 0xf0) === 0x90 && vel > 0) answer(note);
        };
      }
      midiLabel.textContent = names.length
        ? `MIDI connected: ${names.join(", ")}`
        : "MIDI: no device — plug in the piano and it connects automatically.";
    };
    access.onstatechange = wire;
    wire();
  }, () => { midiLabel.textContent = "MIDI: permission denied."; });
} else {
  midiLabel.textContent = "MIDI: not supported in this browser (use Chrome) — mic and buttons still work.";
}

// ---------- On-screen keys + computer keyboard (octave-free fallback) ----------
const keysRow = document.getElementById("keys");
for (const L of ["C", "D", "E", "F", "G", "A", "B"]) {
  const b = document.createElement("button");
  b.textContent = L;
  b.style.background = LETTER_COLORS[L];
  b.onclick = () => answer({ C:60, D:62, E:64, F:65, G:67, A:69, B:71 }[L], true);
  keysRow.appendChild(b);
}
document.addEventListener("keydown", e => {
  const L = e.key.toUpperCase();
  if ("ABCDEFG".includes(L) && L.length === 1)
    answer({ C:60, D:62, E:64, F:65, G:67, A:69, B:71 }[L], true);
});

document.getElementById("skipBtn").onclick = next;
document.getElementById("optLetters").onchange = draw;
document.getElementById("optColors").onchange = draw;

next();
</script>
</body>
</html>
