# klaviearn.162-243-66-225.sslip.io — legacy hostname, redirects to the
# real domain. Lives in /opt/services/nginx/conf.d/ on the VPS.

server {
    listen 80;
    server_name klaviearn.162-243-66-225.sslip.io;

    # ACME webroot — keeps the Let's Encrypt cert renewing so the HTTPS
    # redirect below stays valid.
    location /.well-known/acme-challenge/ {
        root /var/www/static;
    }
    location / {
        return 301 https://klaviearn.app$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name klaviearn.162-243-66-225.sslip.io;

    ssl_certificate /etc/nginx/ssl/klaviearn.pem;
    ssl_certificate_key /etc/nginx/ssl/klaviearn.key;

    return 301 https://klaviearn.app$request_uri;
}
