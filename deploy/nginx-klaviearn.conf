# klaviearn.162-243-66-225.sslip.io — Klaviearn (sight-reading trainer)
# Lives in /opt/services/nginx/conf.d/ on the VPS.

server {
    listen 80;
    server_name klaviearn.162-243-66-225.sslip.io;

    # ACME webroot: /var/www/static is the container path of
    # /opt/services/static-site, where host certbot writes challenges.
    location /.well-known/acme-challenge/ {
        root /var/www/static;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name klaviearn.162-243-66-225.sslip.io;

    ssl_certificate /etc/nginx/ssl/klaviearn.pem;
    ssl_certificate_key /etc/nginx/ssl/klaviearn.key;

    location / {
        proxy_pass http://klaviearn:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
