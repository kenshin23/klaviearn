# klaviearn.app — Klaviearn (canonical domain, Cloudflare-proxied, Full strict)
# Lives in /opt/services/nginx/conf.d/ on the VPS.

server {
    listen 80;
    server_name klaviearn.app www.klaviearn.app;
    return 301 https://klaviearn.app$request_uri;
}

server {
    listen 443 ssl;
    server_name klaviearn.app www.klaviearn.app;

    ssl_certificate /etc/nginx/ssl/klaviearn.app.pem;
    ssl_certificate_key /etc/nginx/ssl/klaviearn.app.key;

    # canonicalize www at the origin too
    if ($host = www.klaviearn.app) {
        return 301 https://klaviearn.app$request_uri;
    }

    location / {
        proxy_pass http://klaviearn:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
